name: Weekly analytics report

# Pulls GA4 + Search Console figures and commits them to codex/reports/.
#
# Requires two repository secrets; without them the job exits cleanly rather
# than failing every Monday:
#   GA_SERVICE_ACCOUNT_JSON  service account key, Viewer on both properties
#   GA4_PROPERTY_ID          numeric GA4 property id
#
# Weekly rather than daily on purpose: standard GA4 reports lag 24-48h, so
# daily numbers move under you after the fact.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A missing secret is skipped on the weekly schedule, so the job does not
      # go red every Monday for something nobody can fix from here. On a manual
      # run it fails loudly instead: someone is watching, and a green run that
      # quietly did nothing is worse than a red one.
      - name: Check credentials
        id: creds
        env:
          KEY: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          PROP: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          missing=""
          [ -z "$KEY" ]  && missing="$missing GA_SERVICE_ACCOUNT_JSON"
          [ -z "$PROP" ] && missing="$missing GA4_PROPERTY_ID"

          if [ -n "$missing" ]; then
            echo "::warning::missing repository secrets:$missing"
            echo "Set them in Settings -> Secrets and variables -> Actions."
            echo "They must be *repository* secrets; environment secrets are not visible here."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::manual run cannot proceed without:$missing"
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "both secrets present (key length: ${#KEY} chars)"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: pip install -r codex/scripts/requirements.txt

      - name: Generate report
        if: steps.creds.outputs.ready == 'true'
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          printf '%s' '${{ secrets.GA_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/ga-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/ga-key.json"
          python3 codex/scripts/ga4_report.py --days 7 --write
          rm -f "$RUNNER_TEMP/ga-key.json"

      - name: Commit report
        if: steps.creds.outputs.ready == 'true'
        run: |
          # Assert the report exists rather than letting `git add` on a missing
          # path decide the outcome -- that failure mode reads as a git problem.
          test -d codex/reports || { echo "::error::the script produced no report"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add codex/reports/
          if git diff --staged --quiet; then
            echo "::warning::report is byte-identical to the previous one, nothing to commit"
          else
            git commit -m "#4 Add weekly analytics report"
            git push
          fi
