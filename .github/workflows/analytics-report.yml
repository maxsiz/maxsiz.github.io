name: Weekly analytics report

# Pulls GA4 + Search Console figures and commits them to codex/reports/.
#
# Requires two repository secrets; without them the job exits cleanly rather
# than failing every Monday:
#   GA_SERVICE_ACCOUNT_JSON  service account key, Viewer on both properties
#   GA4_PROPERTY_ID          numeric GA4 property id
#
# Weekly rather than daily on purpose: standard GA4 reports lag 24-48h, so
# daily numbers move under you after the fact.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A missing secret is skipped on the weekly schedule, so the job does not
      # go red every Monday for something nobody can fix from here. On a manual
      # run it fails loudly instead: someone is watching, and a green run that
      # quietly did nothing is worse than a red one.
      - name: Check credentials
        id: creds
        env:
          KEY: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          PROP: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          missing=""
          [ -z "$KEY" ]  && missing="$missing GA_SERVICE_ACCOUNT_JSON"
          [ -z "$PROP" ] && missing="$missing GA4_PROPERTY_ID"

          if [ -n "$missing" ]; then
            echo "::warning::missing repository secrets:$missing"
            echo "Set them in Settings -> Secrets and variables -> Actions."
            echo "They must be *repository* secrets; environment secrets are not visible here."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::manual run cannot proceed without:$missing"
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "both secrets present (key length: ${#KEY} chars)"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: pip install -r codex/scripts/requirements.txt

      - name: Generate report
        if: steps.creds.outputs.ready == 'true'
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          printf '%s' '${{ secrets.GA_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/ga-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/ga-key.json"
          python3 codex/scripts/ga4_report.py --days 7 > "$RUNNER_TEMP/report.md"
          rm -f "$RUNNER_TEMP/ga-key.json"
          test -s "$RUNNER_TEMP/report.md" || { echo "::error::the script produced an empty report"; exit 1; }

      # Primary delivery: the report renders on the run page itself, so reading
      # it needs no checkout, no branch and no download.
      - name: Publish to run summary
        if: steps.creds.outputs.ready == 'true'
        run: cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Durable copy. master is a protected branch and rightly refuses pushes
      # from the bot, and a weekly automated pull request for a file nobody
      # reviews is noise -- so history lives on its own branch instead.
      - name: Append to the analytics-reports branch
        if: steps.creds.outputs.ready == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin analytics-reports >/dev/null 2>&1; then
            git fetch --depth=1 origin analytics-reports
            git checkout -B analytics-reports origin/analytics-reports
          else
            echo "creating the analytics-reports branch"
            git checkout -B analytics-reports
          fi

          month=$(date -u +%Y-%m)
          mkdir -p codex/reports
          {
            cat "$RUNNER_TEMP/report.md"
            printf '\n\n---\n\n'
          } >> "codex/reports/${month}.md"

          git add "codex/reports/${month}.md"
          git commit -m "#4 Add analytics report for $(date -u +%Y-%m-%d)"
          git push origin analytics-reports
